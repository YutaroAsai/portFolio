<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width" />
    <title>記事一覧 | 氏名を書く</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav>
        <a href="/">プロフィール</a>
        <a class="secondary" href="/works/">制作物</a>
        <a class="secondary" href="/articles/">記事</a>
      </nav>
    </header>
    <main>
      <section>
        <h2>記事一覧</h2>
        <!--
          記事を追加したら、ここに work-card を1つ追記する。
          テンプレート: templates/article-template.html

          Zennにリンクする場合(本文はこのサイトに置かない):
          <a class="work-card" href="https://zenn.dev/your-account/articles/xxx" target="_blank" rel="noopener noreferrer">
            <h3>記事タイトル</h3>
            <p>1〜2行の要約</p>
            <time>2026-08-01</time>
            <ul class="tag-list"><li>Zenn</li></ul>
          </a>

          このサイト内に本文を置く場合:
          <a class="work-card" href="/articles/my-article.html">
            <h3>記事タイトル</h3>
            <p>1〜2行の要約</p>
            <time>2026-08-01</time>
          </a>
        -->
        <p>準備中です。</p>
      </section>
    </main>
  </body>
</html>
